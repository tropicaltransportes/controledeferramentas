<!doctype html>
<!--
  PROTÓTIPO DESCARTÁVEL — não é código de produção.
  Pergunta: a "cara de sistema" (menu lateral, painel, catálogo com foto, ficha da ferramenta,
  perfil do funcionário) atende? Design único, inspirado na referência enviada pelo Gestor.
  Dados falsos, em memória: recarregar a página volta tudo ao início.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo – Controle de Ferramentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    /* Paleta oficial Tropical Transportes (Manual de Marca, p.25) */
    --verde-escuro: #06772b; --verde-claro: #00c038; --branco-gelo: #edfff2; --azul-miragem: #1c2a3a; --verde-banana: #c7d291;
    --brand: var(--verde-escuro); --brand-600: #055e22; --brand-soft: #e3f3e8;
    --bg: #f3f6f4; --card: #fff; --line: #eceef2; --ink: #1f2937; --muted: #8a93a3;
    --green: #16a34a; --green-soft: #e8f7ee; --amber: #d97706; --amber-soft: #fff4e0;
    --red: #dc2626; --red-soft: #fdecec; --blue: #2563eb; --blue-soft: #eaf1fe; --gray-soft: #f0f2f5;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 Inter, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 14px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  button:hover { border-color: #d6dae1; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--brand-600); }
  button.outline { border-color: var(--brand); color: var(--brand); font-weight: 600; }
  button.ok { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  button.danger { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
  button.ghost { border-color: transparent; background: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  button svg, .ico svg { width: 18px; height: 18px; }
  input, select, textarea { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .num { font-family: ui-monospace, Consolas, monospace; font-weight: 600; font-size: 12px; color: var(--muted); }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Shell */
  .shell { display: grid; grid-template-columns: 76px 1fr; min-height: 100vh; }
  .side { background: var(--azul-miragem); display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .logo { width: 46px; height: 46px; margin-bottom: 18px; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .nav { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: #9fb0c2; position: relative; }
  .nav svg { width: 22px; height: 22px; }
  .nav:hover { background: rgba(237,255,242,.08); color: var(--branco-gelo); }
  .nav.on { background: var(--verde-escuro); color: #fff; box-shadow: inset 3px 0 0 var(--verde-claro), 0 6px 14px rgba(0,0,0,.25); }
  .nav .tip { position: absolute; left: 58px; background: var(--ink); color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; opacity: 0; pointer-events: none; transition: .15s; z-index: 5; }
  .nav:hover .tip { opacity: 1; }
  .side .sep { flex: 1; }
  .proto { font-size: 9px; font-weight: 800; color: #fff; background: #ff2d87; padding: 3px 6px; border-radius: 6px; letter-spacing: .04em; writing-mode: vertical-rl; transform: rotate(180deg); }
  .reset { font-size: 10px; padding: 4px 6px; margin-top: 6px; }
  .main { min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .search { position: relative; flex: 1; max-width: 420px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
  .search input { padding-left: 36px; background: var(--bg); border-color: transparent; }
  .top .acts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .me { display: flex; align-items: center; gap: 10px; padding-left: 12px; margin-left: 4px; border-left: 1px solid var(--line); }
  .me .t { line-height: 1.2; } .me .t b { display: block; font-size: 13px; } .me .t span { font-size: 11px; color: var(--muted); }
  .content { padding: 24px 28px 60px; max-width: 1360px; }
  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .page-head .acts { margin-left: auto; display: flex; gap: 8px; }
  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .crumb a:hover { color: var(--brand); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .card-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px 12px; }
  .card-h .sub { font-size: 12px; color: var(--muted); }
  .card-b { padding: 0 20px 18px; }

  .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; color: #fff; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .b-disp { background: var(--green-soft); color: var(--green); }
  .b-fora { background: var(--blue-soft); color: var(--blue); }
  .b-atr { background: var(--red-soft); color: var(--red); }
  .b-prob { background: var(--amber-soft); color: var(--amber); }
  .b-off { background: var(--gray-soft); color: var(--muted); }
  .thumb { border-radius: 12px; display: grid; place-items: center; flex: none; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }

  /* Painel */
  .dash { display: grid; grid-template-columns: 1fr 380px; gap: 18px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 12px; }
  .kpi { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; padding: 6px; border-radius: 10px; }
  .kpi:hover { background: var(--bg); }
  .kpi .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .kpi .n { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .kpi .l { font-size: 12px; color: var(--muted); }
  .hl { background: linear-gradient(135deg, var(--verde-escuro), #04591f); color: #fff; border-radius: 14px; padding: 18px 20px; display: flex; align-items: center; gap: 14px; box-shadow: 0 8px 22px rgba(6,119,43,.28); position: relative; overflow: hidden; }
  .hl::after { content: ""; position: absolute; right: -18px; top: -18px; width: 70px; height: 70px; border-radius: 0 0 0 70px; background: var(--verde-claro); opacity: .35; }
  .hl > * { position: relative; z-index: 1; }
  .hl .t { flex: 1; } .hl .t b { font-size: 17px; display: block; } .hl .t span { font-size: 12px; opacity: .9; }
  .hl .big { font-size: 34px; font-weight: 800; }
  .hl button { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.25); color: #fff; font-weight: 600; }
  .hl.dark { background: linear-gradient(135deg, #253749, var(--azul-miragem)); box-shadow: 0 8px 22px rgba(28,42,58,.25); }
  .hl.dark .big { color: #ff8a8a; }
  .feed { list-style: none; margin: 0; padding: 0; max-height: 430px; overflow: auto; }
  .feed li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .feed li:last-child { border-bottom: 0; }
  .feed .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .feed .dot svg { width: 15px; height: 15px; }
  .feed .txt { flex: 1; min-width: 0; }
  .feed .txt b { font-weight: 600; }
  .feed .when { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .rowlist .r { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .rowlist .r:last-child { border-bottom: 0; }
  .rowlist .r:hover .nm { color: var(--brand); }
  .rowlist .nm { font-weight: 600; }
  .rank { font-size: 13px; }
  .rank .bar { height: 6px; border-radius: 99px; background: var(--brand-soft); overflow: hidden; margin-top: 4px; }
  .rank .bar i { display: block; height: 100%; background: var(--brand); border-radius: 99px; }

  /* Ferramentas */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { border-radius: 99px; padding: 6px 12px; font-size: 13px; }
  .pill b { font-weight: 700; margin-left: 2px; color: var(--muted); }
  .pill.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pill.on b { color: #fff; opacity: .7; }
  .toolbar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .toolbar select { width: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; border-radius: 0; padding: 7px 10px; }
  .seg button.on { background: var(--gray-soft); color: var(--brand); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .tcard { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); transition: .15s; display: flex; flex-direction: column; }
  .tcard:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(16,24,40,.1); }
  .tcard .ph { height: 130px; display: grid; place-items: center; position: relative; }
  .tcard .ph .badge { position: absolute; top: 10px; right: 10px; }
  .tcard .bd { padding: 12px 14px 14px; flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .tcard .bd b { font-weight: 600; }
  .tcard .who { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; }
  .tcard.atr { border-color: #f5b5b5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; } tbody tr:hover td { background: #fafbfc; }
  .cell { display: flex; align-items: center; gap: 10px; }

  /* Ficha / Perfil */
  .detail { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
  .profile { padding: 20px; }
  .profile .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 8px 0 16px; }
  .profile .hero b { font-size: 18px; }
  .minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .mini { display: flex; gap: 10px; align-items: center; }
  .mini .ico { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
  .mini .ico svg { width: 16px; height: 16px; }
  .mini .n { font-weight: 700; font-size: 16px; line-height: 1; } .mini .l { font-size: 11px; color: var(--muted); }
  .specs { padding-top: 14px; }
  .specs h3 { font-size: 13px; margin: 0 0 10px; }
  .specs dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; font-size: 13px; }
  .specs dt { color: var(--muted); } .specs dd { margin: 0; font-weight: 500; text-align: right; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
  .tab { border: 0; background: transparent; border-radius: 0; padding: 14px 12px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab.on { color: var(--brand); border-bottom-color: var(--brand); }
  .posse { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
  .posse .t { flex: 1; }
  .posse.atr { border-color: #f5b5b5; background: var(--red-soft); }
  .tl { list-style: none; margin: 0; padding: 0 0 0 6px; }
  .tl li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); }
  .tl li:last-child { border-left-color: transparent; }
  .tl li::before { content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--c, var(--brand)); box-shadow: 0 0 0 3px #fff; }
  .tl .h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tl .h b { font-weight: 600; }
  .tl .h span { margin-left: auto; font-size: 12px; color: var(--muted); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  /* Modais */
  .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 16px; z-index: 40; overflow: auto; }
  .modal { background: #fff; border-radius: 16px; width: 100%; max-width: 640px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .modal .mh { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); }
  .modal .mh .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
  .modal .mh h2 { font-size: 17px; }
  .modal .mh .x { margin-left: auto; }
  .modal .mb { padding: 18px 22px; }
  .modal .mf { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 22px; border-top: 1px solid var(--line); background: #fafbfc; border-radius: 0 0 16px 16px; }
  .step { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 8px; }
  .step + * { margin-bottom: 16px; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; max-height: 200px; overflow: auto; margin-top: 8px; }
  .person { display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; justify-content: flex-start; font-size: 13px; }
  .person.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-600); font-weight: 600; }
  .person .av { width: 26px; height: 26px; font-size: 10px; }
  .sugg { border: 1px solid var(--line); border-radius: 10px; margin-top: 6px; overflow: hidden; }
  .sugg button { display: flex; width: 100%; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 8px 10px; gap: 10px; text-align: left; }
  .sugg button:last-child { border-bottom: 0; }
  .sugg button:hover, .sugg button.hi { background: var(--bg); }
  .chosen { display: flex; flex-direction: column; gap: 8px; }
  .chosen .it { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; }
  .chosen .it .t { flex: 1; }
  .err { color: var(--red); font-size: 13px; margin-top: 6px; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice button { justify-content: center; padding: 14px; font-size: 15px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form .full { grid-column: 1 / -1; }
  .photo-up { display: flex; align-items: center; gap: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; gap: 8px; align-items: center; }
  .toast svg { width: 16px; height: 16px; color: #4ade80; }

  @media (max-width: 1100px) { .dash { grid-template-columns: 1fr; } .detail { grid-template-columns: 1fr; } }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; }
    .side { position: fixed; bottom: 0; top: auto; left: 0; right: 0; height: 64px; flex-direction: row; justify-content: space-around; padding: 6px; z-index: 30; border-right: 0; border-top: 1px solid var(--line); }
    .side .logo, .side .sep, .proto, .nav .tip { display: none; }
    .reset { margin: 0; }
    .top { padding: 10px 14px; flex-wrap: wrap; } .search { max-width: none; order: 3; flex-basis: 100%; }
    .me .t { display: none; } .top .acts .lbl { display: none; }
    .content { padding: 16px 14px 90px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; } .tcard .ph { height: 100px; }
    .form { grid-template-columns: 1fr; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

const CAT = {

const AVC = ['#06772b','#2563eb', '#16a34a', '#9333ea', '#d97706', '#0891b2', '#db2777', '#4f46e5', '#65a30d', '#64748b'];
let tools, funcs, retiradas, problemas, seq;

function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seed() {
  const T = [
    ['F-001','Torquímetro de estalo','Medição','Gedore','TSN 200','40–200 Nm, encaixe 1/2"'], ['F-002','Torquímetro de estalo','Medição','Gedore','TSN 60','5–60 Nm, encaixe 3/8"'],
    ['F-003','Scanner automotivo','Diagnóstico','Launch','X431 Pro','OBD2, multimarcas'], ['F-004','Multímetro digital','Elétrica','Minipa','ET-1002','CAT III 600 V'],
    ['F-005','Macaco jacaré','Elevação','Bovenau','MJ-3000','3 t, curso 130–500 mm'], ['F-006','Macaco jacaré','Elevação','Bovenau','MJ-3000','3 t, curso 130–500 mm'],
    ['F-007','Cavalete (par)','Elevação','Bovenau','CV-6','6 t por par'], ['F-008','Extrator de rolamento','Mecânica','Tramontina','44512','3 garras, até 150 mm'],
    ['F-009','Jogo de soquetes 1/2"','Mecânica','Gedore','D19','24 peças, 8–32 mm'], ['F-010','Jogo de soquetes 3/4"','Mecânica','Gedore','D32','15 peças, 19–50 mm'],
    ['F-011','Parafusadeira de impacto','Pneumática','Chicago Pneumatic','CP7748','1/2", 1.300 Nm'], ['F-012','Esmerilhadeira angular','Elétrica','Bosch','GWS 850','4.1/2", 850 W'],
    ['F-013','Caneta de polaridade','Elétrica','Planatc','CP-12','12/24 V'], ['F-014','Saca-pino','Mecânica','Tramontina','44380','Jogo 6 peças'],
    ['F-015','Compressor de mola','Suspensão','Raven','109001','Para McPherson'], ['F-016','Medidor de compressão','Diagnóstico','Planatc','MC-300','0–300 psi, gasolina/diesel'],
    ['F-017','Carregador de bateria','Elétrica','Bosch','C7','12/24 V, 230 W'], ['F-018','Talha manual','Elevação','Berg-Steel','TM-1','1 t, corrente 3 m'],
    ['F-019','Paquímetro digital','Medição','Mitutoyo','500-196','0–150 mm, 0,01 mm'], ['F-020','Relógio comparador','Medição','Mitutoyo','2046S','0–10 mm, base magnética'],
    ['F-021','Kit sangria de freio','Freios','Raven','107018','Pneumático, 1 L'], ['F-022','Extrator de bico injetor','Motor','Raven','104055','Diesel common rail'],
    ['F-023','Chave de roda pneumática','Pneumática','Chicago Pneumatic','CP749','3/4", 1.700 Nm'], ['F-024','Lanterna de inspeção','Geral','Tramontina','LED-R','Recarregável, imã'],
  ];
  tools = T.map(([num, nome, cat, marca, modelo, espec], i) => ({ num, nome, cat, marca, modelo, espec, serie: 'SN' + (482310 + i * 37), aquisicao: `${String(1 + i % 12).padStart(2, '0')}/20${21 + i % 4}`, obs: '', foto: null, estado: 'disponivel', probObs: '' }));
  funcs = [['João Silva','Mecânico'],['Pedro Santos','Mecânico'],['Marcos Lima','Mecânico'],['Rafael Costa','Eletricista'],['Diego Alves','Mecânico'],
    ['Carlos Souza','Mecânico'],['André Rocha','Borracheiro'],['Lucas Pereira','Auxiliar'],['Bruno Dias','Mecânico']].map(([nome, funcao], i) => ({ id: i + 1, nome, funcao, ativo: true }));
  funcs.push({ id: 10, nome: 'Fábio Nunes', funcao: 'Mecânico', ativo: false });
  retiradas = []; problemas = []; seq = 1;
  const now = Date.now(), H = 3600000, D = 24 * H;
  const abertas = [['F-003', 1, 1.6 * H], ['F-009', 1, 1.6 * H], ['F-001', 2, 0.7 * H], ['F-005', 3, 26 * H], ['F-019', 3, 3 * H], ['F-011', 4, 0.3 * H],
    ['F-015', 5, 72 * H], ['F-004', 6, 5 * H], ['F-021', 6, 5 * H], ['F-017', 10, 9 * D]];
  const openStart = Object.fromEntries(abertas.map(([n, , ago]) => [n, now - ago]));
  // Histórico de 30 dias, sem sobreposição por ferramenta
  const r = rng(7), busy = {};
  for (let d = 30; d >= 1; d--) {
    const day = new Date(now - d * D); if (day.getDay() === 0) continue;
    const n = 3 + Math.floor(r() * 5);
    for (let k = 0; k < n; k++) {
      const t = tools[Math.floor(Math.pow(r(), 1.6) * tools.length)];
      const ini = new Date(day); ini.setHours(7 + Math.floor(r() * 8), Math.floor(r() * 60), 0, 0);
      const fim = new Date(ini.getTime() + (0.5 + r() * 5) * H);
      if ((busy[t.num] || 0) > ini.getTime() || (openStart[t.num] && fim.getTime() > openStart[t.num]) || t.num === 'F-012') continue;
      busy[t.num] = fim.getTime();
      const f = funcs[Math.floor(r() * 9)];
      const prob = r() < 0.05;
      retiradas.push({ id: seq++, num: t.num, funcId: f.id, inicio: ini, fim, resultado: prob ? 'com_problema' : 'ok', obs: prob ? 'Folga no encaixe' : '' });
      if (prob) problemas.push({ num: t.num, data: fim, funcId: f.id, desc: 'Folga no encaixe', destino: 'Liberada', destinoData: new Date(fim.getTime() + 2 * D) });
    }
  }
  abertas.forEach(([num, funcId, ago]) => retiradas.push({ id: seq++, num, funcId, inicio: new Date(now - ago), fim: null, resultado: null, obs: '' }));
  const t12 = tools.find(t => t.num === 'F-012');
  const ini12 = new Date(now - 2 * D); ini12.setHours(8, 10);
  const fim12 = new Date(ini12.getTime() + 4 * H);
  retiradas.push({ id: seq++, num: 'F-012', funcId: 8, inicio: ini12, fim: fim12, resultado: 'com_problema', obs: 'Escova gasta, não liga.' });
  problemas.push({ num: 'F-012', data: fim12, funcId: 8, desc: 'Escova gasta, não liga.', destino: null });
  t12.estado = 'com_problema'; t12.probObs = 'Escova gasta, não liga.';
}

// ---------- Regras (glossário) ----------
const fimExpediente = (d) => { const e = new Date(d), w = e.getDay(); if (w === 0) { e.setHours(0, 0, 0, 0); return e; } e.setHours(w === 6 ? 13 : 19, 0, 0, 0); return e; };
const aberta = (num) => retiradas.find(r => r.num === num && !r.fim);
const isAtrasada = (r) => !r.fim && Date.now() > fimExpediente(r.inicio).getTime();
const func = (id) => funcs.find(f => f.id === id);
const tool = (num) => tools.find(t => t.num === num);
const disponivel = (t) => t.estado === 'disponivel' && !aberta(t.num);
function statusOf(t) {
  if (t.estado === 'baixada') return { k: 'off', txt: 'Baixada' };
  if (t.estado === 'extraviada') return { k: 'off', txt: 'Extraviada' };
  if (t.estado === 'com_problema') return { k: 'prob', txt: 'Com Problema' };
  const r = aberta(t.num);
  if (r) return isAtrasada(r) ? { k: 'atr', txt: 'Atrasada', r } : { k: 'fora', txt: 'Fora', r };
  return { k: 'disp', txt: 'No almoxarifado' };
}
const badge = (st) => `<span class="badge b-${st.k}">${st.txt}</span>`;

function retirar(funcId, nums) { nums.forEach(num => retiradas.push({ id: seq++, num, funcId, inicio: new Date(), fim: null, resultado: null, obs: '' })); toast(`Retirada registrada para ${func(funcId).nome} (${nums.length})`); }
function devolver(num, ok, obs = '') {
  const r = aberta(num); if (!r) return;
  r.fim = new Date(); r.resultado = ok ? 'ok' : 'com_problema'; r.obs = obs;
  if (!ok) { tool(num).estado = 'com_problema'; tool(num).probObs = obs; problemas.push({ num, data: r.fim, funcId: r.funcId, desc: obs, destino: null }); }
  toast(ok ? `${num} devolvida OK` : `${num} devolvida Com Problema`);
}

      <div class="acts"><button class="primary" data-act="new-tool">${ic('plus')} Nova Ferramenta</button></div></div>
    <div class="toolbar">
      <div class="pills">${Object.entries(F).map(([k, [l, fn]]) => `<button class="pill ${ui.ftF === k ? 'on' : ''}" data-ftf="${k}">${l} <b>${tools.filter(fn).length}</b></button>`).join('')}</div>
      <div class="right">
        <input id="ftq" placeholder="Filtrar…" value="${esc(ui.ftQ)}" style="width:180px">
        <select id="ftcat"><option value="">Todas as categorias</option>${Object.keys(CAT).map(c => `<option ${ui.ftCat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        <div class="seg"><button class="${ui.ftView === 'grid' ? 'on' : ''}" data-ftv="grid" title="Cartões">${ic('grid')}</button><button class="${ui.ftView === 'list' ? 'on' : ''}" data-ftv="list" title="Lista">${ic('list')}</button></div>
      </div>
    </div>
    ${!rows.length ? '<div class="card empty">Nenhuma ferramenta nesse filtro.</div>' : ui.ftView === 'grid'
      ? `<div class="grid">${rows.map(t => { const st = statusOf(t); return `<a class="tcard ${st.k === 'atr' ? 'atr' : ''}" href="#/ferramenta/${t.num}">
          <div class="ph">${thumb(t, 'full', 0)}${badge(st)}</div>
          <div class="bd"><span class="num">${t.num}</span><b>${esc(t.nome)}</b><span class="small muted">${esc(t.espec)}</span>
          ${st.r ? `<div class="who">${who(st)}</div>` : st.k === 'prob' ? `<div class="who" style="color:var(--amber)">${ic('alert')} ${esc(t.probObs)}</div>` : ''}</div></a>`; }).join('')}</div>`
      : `<div class="card" style="overflow-x:auto"><table><thead><tr><th>Ferramenta</th><th class="hide-sm">Categoria</th><th>Situação</th><th>Com quem</th></tr></thead><tbody>
          ${rows.map(t => { const st = statusOf(t); return `<tr data-go="#/ferramenta/${t.num}"><td><div class="cell">${thumb(t, 38, 9)}<div><b>${esc(t.nome)}</b><div class="num">${t.num} · ${esc(t.marca)} ${esc(t.modelo)}</div></div></div></td>
            <td class="hide-sm muted">${t.cat}</td><td>${badge(st)}</td><td><div class="cell small">${who(st)}</div></td></tr>`; }).join('')}</tbody></table></div>`}`;
  const ftq = v.querySelector('#ftq');
  ftq.oninput = () => { ui.ftQ = ftq.value; const p = ftq.selectionStart; route(); const n = document.getElementById('ftq'); n.focus(); n.setSelectionRange(p, p); };
  v.querySelector('#ftcat').onchange = e => { ui.ftCat = e.target.value; route(); };
}

function viewFerramenta(v, num) {
  const t = tool(num); if (!t) { v.innerHTML = '<div class="card empty">Ferramenta não encontrada.</div>'; return; }
  const st = statusOf(t), hist = retiradas.filter(r => r.num === num).sort((a, b) => b.inicio - a.inicio);
  const probs = problemas.filter(p => p.num === num).sort((a, b) => b.data - a.data);
  const horas = Math.round(hist.reduce((s, r) => s + ((r.fim || new Date()) - r.inicio), 0) / 3600000);
  const pessoas = new Set(hist.map(r => r.funcId)).size;
  const mini = (n, l, icon, bg, fg) => `<div class="mini"><div class="ico" style="background:${bg};color:${fg}">${ic(icon)}</div><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`;
  let posse;
  if (st.r) { const f = func(st.r.funcId); posse = `<div class="posse ${st.k === 'atr' ? 'atr' : ''}">${av(f, 44)}<div class="t"><a href="#/funcionario/${f.id}"><b>${esc(f.nome)}</b></a> <span class="muted small">${esc(f.funcao)}</span><br>
      <span class="small">Retirada em ${dataHora(st.r.inicio)} · ${quando(st.r.inicio)}</span></div>${badge(st)}<button class="primary" data-act="dev" data-num="${num}">${ic('back')} Devolver</button></div>`; }
  else if (st.k === 'prob') posse = `<div class="posse" style="background:var(--amber-soft);border-color:#f8d79a"><div class="t"><b style="color:var(--amber)">Com Problema – fora de circulação</b><br><span class="small">${esc(t.probObs)}</span></div>
      <button data-act="dest" data-num="${num}" data-d="Liberada">${ic('check')} Liberar</button><button data-act="dest" data-num="${num}" data-d="Baixada">${ic('trash')} Baixar</button></div>`;
  else if (st.k === 'disp') posse = `<div class="posse"><div class="t"><b style="color:var(--green)">No almoxarifado</b><br><span class="small muted">Disponível para Retirada</span></div><button class="primary" data-act="ret" data-num="${num}">${ic('out')} Registrar Retirada</button></div>`;
  else posse = `<div class="posse"><div class="t"><b>${st.txt}</b><br><span class="small muted">Não circula mais. Permanece no histórico.</span></div></div>`;
  const tl = (rs) => rs.length ? `<ul class="tl">${rs.map(r => { const f = func(r.funcId); const c = !r.fim ? 'var(--blue)' : r.resultado === 'ok' ? 'var(--green)' : r.resultado === 'extraviada' ? 'var(--red)' : 'var(--amber)';
    const fimTxt = !r.fim ? (isAtrasada(r) ? '<span class="badge b-atr">Atrasada</span>' : '<span class="badge b-fora">Em uso</span>') : r.resultado === 'ok' ? `devolvida ${dataHora(r.fim)}` : r.resultado === 'extraviada' ? '<span class="badge b-off">Extraviada</span>' : `<span class="badge b-prob">Com Problema</span> “${esc(r.obs)}”`;
    return `<li style="--c:${c}"><div class="h"><b>${esc(f.nome)}</b><span>${dataHora(r.inicio)}</span></div><div class="small muted" style="margin-top:2px">${fimTxt}</div></li>`; }).join('')}</ul>` : '<div class="empty">Sem registros.</div>';
  const tabs = { resumo: 'Resumo', historico: `Histórico (${hist.length})`, problemas: `Problemas (${probs.length})` };
  v.innerHTML = `
    <div class="page-head"><div><div class="crumb"><a href="#/ferramentas">Ferramentas</a> / ${t.num}</div><h1>${esc(t.nome)}</h1></div>
      <div class="acts"><button data-act="edit-tool" data-num="${num}">${ic('edit')} Editar ficha</button></div></div>
    <div class="detail">
      <div class="card profile">
        <div class="hero">${thumb(t, 140, 18)}<b style="margin-top:8px">${esc(t.nome)}</b><span class="num">${t.num}</span>${badge(st)}</div>
        <div class="minis">${mini(hist.length, 'Retiradas no total', 'out', 'var(--blue-soft)', 'var(--blue)')}${mini(probs.length, 'Problemas', 'alert', 'var(--amber-soft)', 'var(--amber)')}
          ${mini(pessoas, 'Funcionários usaram', 'users', '#efe9ff', '#7c3aed')}${mini(horas + 'h', 'Tempo fora (total)', 'clock', 'var(--brand-soft)', 'var(--brand)')}</div>
        <div class="specs"><h3>Ficha da Ferramenta</h3><dl>
          <dt>Categoria</dt><dd>${esc(t.cat)}</dd><dt>Marca</dt><dd>${esc(t.marca) || '—'}</dd><dt>Modelo</dt><dd>${esc(t.modelo) || '—'}</dd>
          <dt>Especificação</dt><dd>${esc(t.espec) || '—'}</dd><dt>Nº de série</dt><dd>${esc(t.serie) || '—'}</dd><dt>Aquisição</dt><dd>${esc(t.aquisicao) || '—'}</dd>
          ${t.obs ? `<dt>Observações</dt><dd>${esc(t.obs)}</dd>` : ''}</dl></div>
      </div>
      <div class="card" style="min-width:0">
        <div class="tabs">${Object.entries(tabs).map(([k, l]) => `<button class="tab ${ui.toolTab === k ? 'on' : ''}" data-tt="${k}">${l}</button>`).join('')}</div>
        <div style="padding:20px">
          ${ui.toolTab === 'resumo' ? `<h2 style="margin-bottom:4px">Posse da ferramenta</h2><div class="small muted" style="margin-bottom:12px">Com quem está agora</div>${posse}
            <h2 style="margin:24px 0 12px">Últimos registros</h2>${tl(hist.slice(0, 5))}` : ''}
          ${ui.toolTab === 'historico' ? tl(hist) : ''}
          ${ui.toolTab === 'problemas' ? (probs.length ? `<div style="overflow-x:auto"><table><thead><tr><th>Data</th><th>Responsável</th><th>O que aconteceu</th><th>Destino</th></tr></thead><tbody>
            ${probs.map(p => `<tr><td class="small">${dataHora(p.data)}</td><td><div class="cell">${av(func(p.funcId), 24)}${esc(func(p.funcId).nome)}</div></td><td>${esc(p.desc)}</td>
            <td>${p.destino ? `<span class="badge ${p.destino === 'Liberada' ? 'b-disp' : 'b-off'}">${p.destino}</span> <span class="small muted">${dm(p.destinoData)}</span>` : '<span class="badge b-prob">Aguardando</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Nenhum problema registrado. 👍</div>') : ''}
        </div>
      </div>
    </div>`;
}

function viewFuncionarios(v) {
  const q = ui.funcQ.toLowerCase();
  const list = funcs.filter(f => f.nome.toLowerCase().includes(q)).map(f => ({ f, rs: abertasDe(f.id) }))
    .sort((a, b) => b.rs.filter(isAtrasada).length - a.rs.filter(isAtrasada).length || b.rs.length - a.rs.length || b.f.ativo - a.f.ativo || a.f.nome.localeCompare(b.f.nome));
  v.innerHTML = `
    <div class="page-head"><div><h1>Funcionários</h1><div class="muted">${funcs.filter(f => f.ativo).length} ativos</div></div>
      <div class="acts"><input id="fq" placeholder="Filtrar…" value="${esc(ui.funcQ)}" style="width:180px"><button class="primary" data-act="new-func">${ic('plus')} Novo Funcionário</button></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr))">${list.map(({ f, rs }) => { const a = rs.filter(isAtrasada).length; return `
      <a class="card" href="#/funcionario/${f.id}" style="padding:16px;display:flex;gap:12px;align-items:center;${a ? 'border-color:#f5b5b5' : ''};${f.ativo ? '' : 'opacity:.7'}">
        ${av(f, 46)}<div style="flex:1;min-width:0"><b>${esc(f.nome)}</b> ${f.ativo ? '' : '<span class="badge b-off">Inativo</span>'}<div class="small muted">${esc(f.funcao)}</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${rs.length ? `<span class="badge b-fora">${rs.length} em posse</span>` : '<span class="badge b-off">Nada em posse</span>'}${a ? `<span class="badge b-atr">${a} atrasada${a > 1 ? 's' : ''}</span>` : ''}</div></div>
        <div style="display:flex;margin-left:auto">${rs.slice(0, 3).map(r => `<div style="margin-left:-8px;border:2px solid #fff;border-radius:10px">${thumb(tool(r.num), 30, 8)}</div>`).join('')}</div></a>`; }).join('')}</div>`;
  const fq = v.querySelector('#fq');
  fq.oninput = () => { ui.funcQ = fq.value; const p = fq.selectionStart; route(); const n = document.getElementById('fq'); n.focus(); n.setSelectionRange(p, p); };
}

function viewFuncionario(v, id) {
  const f = func(+id); if (!f) { v.innerHTML = '<div class="card empty">Funcionário não encontrado.</div>'; return; }
  const posse = abertasDe(f.id).sort((a, b) => a.inicio - b.inicio), hist = retiradas.filter(r => r.funcId === f.id).sort((a, b) => b.inicio - a.inicio);
  const d30 = Date.now() - 30 * 86400000;
  const probs = hist.filter(r => r.resultado === 'com_problema').length, extr = hist.filter(r => r.resultado === 'extraviada').length;
  const mini = (n, l, icon, bg, fg) => `<div class="mini"><div class="ico" style="background:${bg};color:${fg}">${ic(icon)}</div><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`;
  const tabs = { posse: `Ferramentas em posse (${posse.length})`, historico: `Histórico (${hist.length})` };
  v.innerHTML = `
    <div class="page-head"><div><div class="crumb"><a href="#/funcionarios">Funcionários</a> / ${esc(f.nome)}</div><h1>${esc(f.nome)}</h1></div>
      <div class="acts">${f.ativo ? `<button class="primary" data-act="ret" data-func="${f.id}">${ic('out')} Retirada para ${esc(f.nome.split(' ')[0])}</button>` : ''}</div></div>
    <div class="detail">
      <div class="card profile">
        <div class="hero">${av(f, 96)}<b style="margin-top:8px">${esc(f.nome)}</b><span class="muted">${esc(f.funcao)}</span>${f.ativo ? '<span class="badge b-disp">Ativo</span>' : '<span class="badge b-off">Inativo</span>'}</div>
        <div class="minis">${mini(posse.length, 'Em posse agora', 'tool', 'var(--blue-soft)', 'var(--blue)')}${mini(posse.filter(isAtrasada).length, 'Atrasadas', 'clock', 'var(--red-soft)', 'var(--red)')}
          ${mini(hist.filter(r => r.inicio >= d30).length, 'Retiradas (30 dias)', 'out', 'var(--brand-soft)', 'var(--brand)')}${mini(probs + extr, 'Problemas / Extravios', 'alert', 'var(--amber-soft)', 'var(--amber)')}</div>
        <div style="padding-top:14px"><button style="width:100%;justify-content:center" data-act="toggle-func" data-func="${f.id}">${f.ativo ? 'Marcar como Inativo' : 'Reativar'}</button>
          ${f.ativo && posse.length ? `<div class="small muted" style="margin-top:6px">⚠ Tem ${posse.length} ferramenta${posse.length > 1 ? 's' : ''} em posse. Pode inativar mesmo assim, as Retiradas continuam abertas.</div>` : ''}</div>
      </div>
      <div class="card" style="min-width:0">
        <div class="tabs">${Object.entries(tabs).map(([k, l]) => `<button class="tab ${ui.funcTab === k ? 'on' : ''}" data-fnt="${k}">${l}</button>`).join('')}</div>
        <div style="overflow-x:auto">
        ${ui.funcTab === 'posse' ? (posse.length ? `<table><thead><tr><th>Ferramenta</th><th>Retirada em</th><th>Situação</th><th></th></tr></thead><tbody>
          ${posse.map(r => { const t = tool(r.num); return `<tr data-go="#/ferramenta/${t.num}"><td><div class="cell">${thumb(t, 38, 9)}<div><b>${esc(t.nome)}</b><div class="num">${t.num}</div></div></div></td>
            <td class="small">${dataHora(r.inicio)}<br><span class="muted">${quando(r.inicio)}</span></td><td>${badge(statusOf(t))}</td>
            <td style="text-align:right"><button data-act="dev" data-num="${t.num}">${ic('back')} Devolver</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">Nenhuma ferramenta em posse.</div>') : ''}
        ${ui.funcTab === 'historico' ? `<table><thead><tr><th>Ferramenta</th><th>Retirada</th><th>Devolução</th></tr></thead><tbody>
          ${hist.map(r => { const t = tool(r.num); return `<tr data-go="#/ferramenta/${t.num}"><td><div class="cell">${thumb(t, 32, 8)}<div><b>${esc(t.nome)}</b><div class="num">${t.num}</div></div></div></td>
            <td class="small">${dataHora(r.inicio)}</td><td class="small">${!r.fim ? badge(statusOf(t).r ? statusOf(t) : { k: 'fora', txt: 'Em uso' }) : r.resultado === 'ok' ? dataHora(r.fim) + ' <span class="badge b-disp">OK</span>' : r.resultado === 'extraviada' ? '<span class="badge b-off">Extraviada</span>' : dataHora(r.fim) + ' <span class="badge b-prob">Com Problema</span>'}</td></tr>`; }).join('')}</tbody></table>` : ''}
        </div>
      </div>
    </div>`;
}

// ---------- Roteamento e ações ----------
let cur = location.hash.slice(1) || '/painel';
function go(h) {
  cur = h.replace(/^#/, '');
  try { history.replaceState(null, '', '#' + cur); } catch {}
  onNav();
}
function route() {
  const [path, query] = cur.split('?');
  const [, page, arg] = path.split('/');
  const qs = new URLSearchParams(query || '');
  const v = document.getElementById('view');
  const nav = { painel: 'painel', ferramentas: 'ferramentas', ferramenta: 'ferramentas', funcionarios: 'funcionarios', funcionario: 'funcionarios' }[page] || 'painel';
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  ({ painel: () => viewPainel(v), ferramentas: () => viewFerramentas(v, qs), ferramenta: () => viewFerramenta(v, arg), funcionarios: () => viewFuncionarios(v), funcionario: () => viewFuncionario(v, arg) }[page] || (() => viewPainel(v)))();
}
let lastPage = '';
function onNav() {
  const p = cur.split('?')[0];
  if (p !== lastPage) { ui.toolTab = 'resumo'; ui.funcTab = 'posse'; window.scrollTo(0, 0); lastPage = p; }
  route();
}
document.addEventListener('click', e => {
  if (e.target.closest('.modal-bg')) return;
  const a = e.target.closest('a[href^="#/"]');
  if (a && !e.target.closest('[data-act]')) { e.preventDefault(); return go(a.getAttribute('href')); }
  const el = e.target.closest('[data-act],[data-go],[data-ftf],[data-ftv],[data-tt],[data-fnt]'); if (!el) return;
  const d = el.dataset;
  if (d.go && !e.target.closest('button')) return go(d.go);
  if (d.ftf) { ui.ftF = d.ftf; return route(); }
  if (d.ftv) { ui.ftView = d.ftv; return route(); }
  if (d.tt) { ui.toolTab = d.tt; return route(); }
  if (d.fnt) { ui.funcTab = d.fnt; return route(); }
  e.preventDefault(); e.stopPropagation();
  switch (d.act) {
    case 'ret': return modalRetirada(d.func ? +d.func : null, d.num);
    case 'dev': return modalDevolucao(d.num);
    case 'dest': destino(d.num, d.d); return route();
    case 'edit-tool': return modalFerramenta(d.num);
    case 'new-tool': return modalFerramenta();
    case 'new-func': return modalFuncionario();
    case 'toggle-func': { const f = func(+d.func); f.ativo = !f.ativo; toast(`${f.nome} ${f.ativo ? 'reativado' : 'marcado como Inativo'}`); return route(); }
    case 'reset': seed(); toast('Dados reiniciados'); return route();
  }
});
document.getElementById('gq').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim(); if (!q) return;
  const n = normNum(q);
  const f = funcs.find(f => f.nome.toLowerCase().includes(q.toLowerCase()));
  if (tool(n)) go(`#/ferramenta/${n}`);
  else if (f && !tools.some(t => t.nome.toLowerCase().includes(q.toLowerCase()))) go(`#/funcionario/${f.id}`);
  else { ui.ftF = 'todas'; go(`#/ferramentas?q=${encodeURIComponent(q)}`); }
  e.target.value = '';
});
seed(); lastPage = cur.split('?')[0]; route();
</script>
</body>
</html>
